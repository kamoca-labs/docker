name: deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}
  COMPOSE: docker compose -f compose.yaml -f compose.prod.yaml

jobs:
  build:
    runs-on: <build-runner>
    permissions:
      contents: read
      packages: write
    env:
      # the build uses no secret: dummy value for each ${VAR:?...} in compose.prod.yaml
      DB_PASSWORD: no-secret-at-build
    steps:
      - uses: actions/checkout@v4
      - run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: $COMPOSE build
      - run: $COMPOSE push

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
    runs-on: <deploy-runner>
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # hosted runner only: a self-hosted runner already has the server key
      - run: |
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      - run: sh docker/deploy.sh "$GITHUB_SHA"
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          REGISTRY_HOST: ghcr.io
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
